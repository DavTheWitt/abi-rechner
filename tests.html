<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abi-Rechner Tests</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    li { padding: 0.3rem 0; border-bottom: 1px solid #ddd; }
    .bestanden { color: #2e7d32; }
    .fehlgeschlagen { color: #c62828; }
  </style>
</head>
<body>
  <h1>Tests für rechner.js</h1>
  <h2 id="zusammenfassung"></h2>
  <ul id="liste"></ul>

  <script src="rechner.js"></script>
  <script src="tests.js"></script>
  <script>
    const ergebnisse = fuehreTestsAus();
    for (const { name, bestanden, meldung } of ergebnisse) {
      const eintrag = document.getElementById("liste").appendChild(document.createElement("li"));
      eintrag.className = bestanden ? "bestanden" : "fehlgeschlagen";
      eintrag.textContent = bestanden ? `✓ ${name}` : `✗ ${name}: ${meldung}`;
    }
    const anzahl = ergebnisse.filter((ergebnis) => ergebnis.bestanden).length;
    const zusammenfassung = document.getElementById("zusammenfassung");
    zusammenfassung.textContent = `${anzahl} von ${ergebnisse.length} bestanden`;
    zusammenfassung.className = anzahl === ergebnisse.length ? "bestanden" : "fehlgeschlagen";
  </script>
</body>
</html>
