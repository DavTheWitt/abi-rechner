<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abi-Rechner</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    form { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: flex-end; }
    label { display: flex; flex-direction: column; font-size: 0.9rem; }
    input { font-size: 1rem; padding: 0.3rem; }
    button { font-size: 1rem; padding: 0.3rem 0.8rem; cursor: pointer; }
    #fehler { color: #b00020; min-height: 1.5em; margin: 0.5rem 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid #ddd; }
    #schnitt { font-size: 1.5rem; margin-top: 1.5rem; }
    #punkte, #ziel { width: 5rem; }
    #ziel { border: 3px solid #999; }
    #ziel.unter-ziel { background: #ffcdd2; border-color: #c62828; }
    #ziel.ziel-erreicht { background: #c8e6c9; border-color: #2e7d32; }
    #ziel-abstand { font-size: 1.2rem; min-height: 1.5em; }
    #ziel-abstand.unter-ziel { color: #c62828; font-weight: bold; }
    #ziel-abstand.ziel-erreicht { color: #2e7d32; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Abi-Rechner</h1>

  <form id="fach-formular" novalidate>
    <label>
      Fach
      <input id="name" type="text" autocomplete="off">
    </label>
    <label>
      Punkte (0–15)
      <input id="punkte" type="text" inputmode="numeric" autocomplete="off">
    </label>
    <button type="submit">Hinzufügen</button>
  </form>
  <p id="fehler" role="alert"></p>

  <table>
    <thead>
      <tr><th>Fach</th><th>Punkte</th><th></th></tr>
    </thead>
    <tbody id="liste"></tbody>
  </table>
  <p id="leer-hinweis">Noch keine Fächer eingetragen.</p>

  <p id="schnitt">Durchschnitt: <strong id="schnitt-wert">–</strong></p>

  <label>
    Zielschnitt (Note, z. B. 1,6)
    <input id="ziel" type="text" inputmode="decimal" autocomplete="off">
  </label>
  <p id="ziel-abstand" role="status"></p>

  <button id="zuruecksetzen" type="button">Zurücksetzen</button>

  <script src="rechner.js"></script>
  <script>
    const faecher = [];
    const formular = document.getElementById("fach-formular");
    const nameFeld = document.getElementById("name");
    const punkteFeld = document.getElementById("punkte");
    const fehlerAnzeige = document.getElementById("fehler");
    const liste = document.getElementById("liste");
    const zielFeld = document.getElementById("ziel");
    const zielAbstand = document.getElementById("ziel-abstand");

    // Zeigt den ganzen Zustand neu an und speichert ihn.
    function zeichne() {
      liste.replaceChildren();
      faecher.forEach((fach, index) => {
        const zeile = liste.insertRow();
        zeile.insertCell().textContent = fach.name;
        zeile.insertCell().textContent = fach.punkte;
        const entfernen = zeile.insertCell().appendChild(document.createElement("button"));
        entfernen.textContent = "Entfernen";
        entfernen.setAttribute("aria-label", `Entfernen: ${fach.name}`);
        entfernen.onclick = () => {
          faecher.splice(index, 1);
          zeichne();
        };
      });
      document.getElementById("leer-hinweis").hidden = faecher.length > 0;

      const schnitt = durchschnitt(faecher);
      document.getElementById("schnitt-wert").textContent = formatiereSchnitt(schnitt);
      const ziel = zielStatus(schnitt, zielFeld.value);
      zielAbstand.textContent = ziel.text;
      let klasse = "";
      if (ziel.erreicht !== null) klasse = ziel.erreicht ? "ziel-erreicht" : "unter-ziel";
      zielFeld.className = zielAbstand.className = klasse;

      // localStorage kann gesperrt sein (z. B. im privaten Modus); dann läuft die Seite ohne Speicherung.
      try {
        localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify({ faecher, ziel: zielFeld.value }));
      } catch {}
    }

    formular.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = pruefeName(nameFeld.value, faecher);
      const punkte = pruefePunkte(punkteFeld.value);
      if (!name.ok || !punkte.ok) {
        // Zuerst den Fehler beim Namen zeigen, sonst den bei den Punkten.
        fehlerAnzeige.textContent = name.ok ? punkte.fehler : name.fehler;
        (name.ok ? punkteFeld : nameFeld).focus();
        return;
      }
      faecher.push({ name: name.wert, punkte: punkte.wert });
      fehlerAnzeige.textContent = "";
      formular.reset();
      nameFeld.focus();
      zeichne();
    });

    zielFeld.addEventListener("input", zeichne);

    document.getElementById("zuruecksetzen").addEventListener("click", () => {
      if (!confirm("Alle Fächer und die Zielnote löschen?")) return;
      faecher.length = 0;
      formular.reset();
      zielFeld.value = "";
      fehlerAnzeige.textContent = "";
      zeichne();
    });

    try {
      const zustand = ladeZustand(localStorage.getItem(SPEICHER_SCHLUESSEL));
      faecher.push(...zustand.faecher);
      zielFeld.value = zustand.ziel;
    } catch {}
    zeichne();
  </script>
</body>
</html>
